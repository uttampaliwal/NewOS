[alias]
xtask = "run -p xtask --"

[target.x86_64-unknown-uefi]
rustflags = ["-C", "panic=abort"]

[target.x86_64-unknown-none]
rustflags = [
    "-C",
    "panic=abort",
    "-C",
    "relocation-model=static",
    "-C",
    "link-arg=-Tkernel/linker.ld",
    "-C",
    "link-arg=-z",
    "-C",
    "link-arg=max-page-size=0x1000",
]
