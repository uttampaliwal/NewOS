[package]
name = "turnix-uefi-loader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "turnix-uefi-loader"
path = "src/main.rs"
test = false
bench = false
required-features = ["loader-bin"]

[features]
loader-bin = []

[dependencies]
turnix-abi = { path = "../../shared/abi" }
turnix-serial = { path = "../../shared/serial" }
uefi = { version = "0.37.0", features = ["alloc", "global_allocator"] }
x86_64 = "0.15.2"

[lints]
workspace = true
