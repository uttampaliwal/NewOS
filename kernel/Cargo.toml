[package]
name = "newos-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "newos-kernel-image"
path = "src/bin/newos-kernel-image.rs"
test = false
bench = false

[dependencies]
lazy_static = { version = "1.5.0", default-features = false, features = ["spin_no_std"] }
newos-abi = { path = "../shared/abi" }
pic8259 = "0.11.0"
spin = "0.10.0"
x86_64 = { version = "0.15.4", default-features = false, features = ["abi_x86_interrupt", "instructions"] }
