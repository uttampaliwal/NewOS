[package]
name = "turnix-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "turnix-kernel-image"
path = "src/bin/turnix-kernel-image.rs"
test = false
bench = false

[dependencies]
turnix-abi = { path = "../shared/abi" }
turnix-serial = { path = "../shared/serial" }
x86_64 = "0.15.2"
spin = "0.9.8"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
linked_list_allocator = "0.10.5"
bitflags = "2.8.0"
log = "0.4.22"
pc-keyboard = "0.7.0"
pic8259 = "0.11.0"
acpi = "4.1.1"
