[workspace]
members = [
    "boot/uefi-loader",
    "shared/abi",
    "shared/serial",
    "tools/xtask",
    "kernel",
    "userland/init",
    "userland/shell",
    "userland/libturnix",
    "userland/fault-tester",
    "userland/std",
]
default-members = [
    "shared/abi",
    "shared/serial",
    "userland/libturnix",
    "userland/std",
    "userland/init",
    "userland/shell",
    "userland/fault-tester",
    "tools/xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Uttam", "Codex", "Antigravity"]
repository = "https://github.com/uttampaliwal/Turnix"

[workspace.lints.rust]
warnings = "warn"
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
missing_safety_doc = "warn"
too_many_arguments = "allow"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
# Feature to enable building host-compatible userland bins
host_bin = []
