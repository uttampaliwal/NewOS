[workspace]
members = [
    "boot/uefi-loader",
    "shared/abi",
    "tools/xtask",
    "kernel",
]
default-members = [
    "shared/abi",
    "tools/xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Uttam", "Codex", "Antigravity"]
repository = "https://example.com/newos"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
