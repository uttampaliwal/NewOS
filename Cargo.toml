[workspace]
members = [
    "boot/uefi-loader",
    "shared/abi",
    "shared/error",
    "shared/ipc-proto",
    "shared/serial",
    "shared/tpkg-format",
    "tools/xtask",
    "kernel",
    "userland/init",
    "userland/shell",
    "userland/libturnix",
    "userland/fault-tester",
    "userland/std",
    "userland/package-manager",
    "userland/ipc-broker",
    "userland/service-manager",
    "userland/log-daemon",
    "userland/network-manager",
    "userland/device-manager",
    "userland/compositor",
    "userland/display-manager",
    "userland/desktop-shell",
    "userland/observability",
    "userland/benchmarks",
    "benchmarks",
]
default-members = [
    "shared/abi",
    "shared/serial",
    "userland/libturnix",
    "userland/std",
    "userland/init",
    "userland/shell",
    "userland/fault-tester",
    "userland/compositor",
    "userland/display-manager",
    "userland/desktop-shell",
    "tools/xtask",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Uttam", "Codex", "Antigravity"]
repository = "https://github.com/uttampaliwal/Turnix"

[workspace.lints.rust]
warnings = "warn"
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
missing_safety_doc = "warn"
too_many_arguments = "allow"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
incremental = false

