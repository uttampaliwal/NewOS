name: CI

on:
  pull_request:
    branches: [ master, development ]
  push:
    branches: [ master, development ]

jobs:
  # ── Job 1: build ──────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Build all workspace members (warnings = errors)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --workspace

  # ── Job 2: unit-tests ─────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Run workspace tests
        run: cargo test --workspace

  # ── Job 3: boot-gate ──────────────────────────────────────────────────
  boot-gate:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Run 10-boot gate
        env:
          TURNIX_CI_BOOT_ATTEMPTS: "10"
        run: cargo xtask ci-boot

  # ── Job 4: driver-tests ───────────────────────────────────────────────
  driver-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Run driver test suite
        run: cargo xtask ci-driver-tests

  # ── Job 5: security-regression ────────────────────────────────────────
  security-regression:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Run security regression tests
        run: cargo xtask ci-security

  # ── Job 6: performance-benchmarks ─────────────────────────────────────
  performance-benchmarks:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Run performance benchmarks
        run: cargo xtask ci-bench

  # ── Job 7: lint (clippy) ───────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Run clippy with warnings as errors
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets

  # ── Job 8: docs ────────────────────────────────────────────────────────
  docs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
      - name: Install mdBook
        run: cargo install mdbook || true
      - name: Build mdBook
        run: cd book && mdbook build || echo "mdBook build skipped (book not yet complete)"
      - name: Upload docs artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v5
        with:
          name: docs
          path: target/doc/
          retention-days: 30

  # ── Job 9: fuzz (nightly) ──────────────────────────────────────────────
  fuzz:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
      - name: Build fuzz targets
        run: cd fuzz && cargo build --release
      - name: Run short fuzz campaign (60s each)
        run: |
          cd fuzz
          for target in fuzz_elf_parser fuzz_seccomp_bpf fuzz_ipc_message fuzz_vfs_path fuzz_syscall_args; do
            echo "Fuzzing $target for 60s..."
            timeout 60 ./target/release/$target < /dev/urandom 2>/dev/null || true
            echo "$target completed."
          done
