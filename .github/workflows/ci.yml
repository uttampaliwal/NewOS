name: CI

on:
  pull_request:
    branches: [ master, development ]
  push:
    branches: [ master, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: nightly-2026-06-22

jobs:
  # ── Job 1: build ──────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Build all workspace members (warnings = errors)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --workspace

  # ── Job 2: unit-tests ─────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Run workspace tests
        run: cargo test --workspace

  # ── Job 3: boot-gate ──────────────────────────────────────────────────
  boot-gate:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Run 5-boot gate
        env:
          TURNIX_CI_BOOT_ATTEMPTS: "5"
          TURNIX_QEMU_ACCEL: "tcg"
        run: cargo xtask ci-boot

  # ── Job 4: driver-tests ───────────────────────────────────────────────
  driver-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Run driver test suite
        env:
          TURNIX_QEMU_ACCEL: "tcg"
        run: cargo xtask ci-driver-tests

  # ── Job 5: security-regression ────────────────────────────────────────
  security-regression:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Run security regression tests
        env:
          TURNIX_QEMU_ACCEL: "tcg"
        run: cargo xtask ci-security

  # ── Job 6: performance-benchmarks ─────────────────────────────────────
  performance-benchmarks:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Run performance benchmarks
        env:
          TURNIX_QEMU_ACCEL: "tcg"
        run: cargo xtask ci-bench

  # ── Job 7: lint (clippy) ───────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Run clippy with warnings as errors
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets

  # ── Job 8: supply chain security ──────────────────────────────────────
  supply-chain:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-deny-${{ hashFiles('deny.toml') }}
      - name: Install cargo-deny
        run: which cargo-deny || cargo install cargo-deny
      - name: Audit dependencies
        run: cargo deny check
      - name: Install cargo-audit
        run: which cargo-audit || cargo install cargo-audit
      - name: Check for known vulnerabilities
        run: cargo audit

  # ── Job 9: reproducible build check ──────────────────────────────────
  reproducible:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-none
      - name: First build
        env:
          SOURCE_DATE_EPOCH: "1735689600"
          CARGO_INCREMENTAL: "0"
        run: cargo build --release --target x86_64-unknown-none -p turnix-kernel
      - name: Copy first binary
        run: cp target/x86_64-unknown-none/release/turnix-kernel-image /tmp/turnix-kernel-1
      - name: Clean and rebuild
        run: cargo clean -p turnix-kernel
      - name: Second build
        env:
          SOURCE_DATE_EPOCH: "1735689600"
          CARGO_INCREMENTAL: "0"
        run: cargo build --release --target x86_64-unknown-none -p turnix-kernel
      - name: Compare binaries
        run: |
          cp target/x86_64-unknown-none/release/turnix-kernel-image /tmp/turnix-kernel-2
          sha256sum /tmp/turnix-kernel-1 /tmp/turnix-kernel-2
          if ! cmp -s /tmp/turnix-kernel-1 /tmp/turnix-kernel-2; then
            echo "FAIL: Binaries differ — build is not reproducible"
            exit 1
          fi
          echo "PASS: Binaries are identical"

  # ── Job 10: docs ────────────────────────────────────────────────────────
  docs:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
      - name: Install mdBook
        run: cargo install mdbook || true
      - name: Build mdBook
        run: cd book && mdbook build || echo "mdBook build skipped (book not yet complete)"
      - name: Upload docs artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v5
        with:
          name: docs
          path: target/doc/
          retention-days: 30

  # ── Job 11: fuzz (nightly) ──────────────────────────────────────────────
  fuzz:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build fuzz targets
        run: cd fuzz && cargo build --release
      - name: Run short fuzz campaign (60s each)
        run: |
          cd fuzz
          for target in fuzz_elf_parser fuzz_seccomp_bpf fuzz_ipc_message fuzz_vfs_path fuzz_syscall_args; do
            echo "Fuzzing $target for 60s..."
            timeout 60 ./target/release/$target < /dev/urandom 2>/dev/null || true
            echo "$target completed."
          done
