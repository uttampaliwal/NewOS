name: CI

on:
  pull_request:
    branches: [ turnix-next ]
  push:
    branches: [ turnix-next ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  lint:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Run clippy on host crates
        run: |
          cargo clippy -p turnix-abi -p turnix-serial -p xtask -p libturnix -p turnix-std -- -D warnings
          cargo clippy -p turnix-kernel --lib -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Run workspace tests
        run: cargo test --workspace

  build:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Set environment for reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(date +%s)" >> $GITHUB_ENV
      - name: Build host libraries and OS images
        run: |
          cargo build -p turnix-abi -p turnix-serial -p xtask -p libturnix -p turnix-std --release
          cargo build -p turnix-kernel --lib --release
          cargo build -p turnix-uefi-loader --target x86_64-unknown-uefi --release
          cargo build -p init -p shell -p fault-tester --target x86_64-unknown-none --release

  qemu-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Run QEMU smoke test
        run: cargo xtask test-qemu
