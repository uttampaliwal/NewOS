[package]
name = "display-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "display-manager"
test = false
required-features = ["host_bin"]

[lib]
name = "display_manager"
path = "src/lib.rs"

[dependencies]
turnix-abi = { path = "../../shared/abi" }
libturnix = { path = "../libturnix" }
sha2 = { version = "0.10", default-features = false }

[features]
host_bin = []
